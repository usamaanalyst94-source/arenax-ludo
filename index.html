<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Premium - Elite Multiplayer Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');
    body { font-family: 'Outfit', sans-serif; background-color: #070514; color: #f8fafc; overflow-x: hidden; }

    .pawn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: white;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.9), inset 0 -2px 4px rgba(0,0,0,0.6);
      position: absolute;
      z-index: 50;
      transform: translate(-50%, -50%);
    }
    .pawn:hover { transform: translate(-50%, -50%) scale(1.4) translateY(-4px); filter: brightness(1.3); }
    .pawn.highlight { animation: proGlow 0.8s infinite alternate; }

    .pawn-red { background: radial-gradient(circle at 35% 35%, #f87171, #dc2626 70%, #991b1b); border: 2px solid #fee2e2; }
    .pawn-green { background: radial-gradient(circle at 35% 35%, #4ade80, #16a34a 70%, #166534); border: 2px solid #dcfce7; }
    .pawn-yellow { background: radial-gradient(circle at 35% 35%, #facc15, #ca8a04 70%, #854d0e); border: 2px solid #fef9c3; }
    .pawn-blue { background: radial-gradient(circle at 35% 35%, #60a5fa, #2563eb 70%, #1e40af); border: 2px solid #eff6ff; }

    @keyframes proGlow {
      0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 10px #fff, 0 0 20px currentColor; }
      100% { transform: translate(-50%, -50%) scale(1.25); box-shadow: 0 0 20px #fff, 0 0 35px currentColor; }
    }

    @keyframes diceRoll {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-15deg) scale(1.1); }
      50% { transform: rotate(15deg) scale(0.95); }
      75% { transform: rotate(-10deg) scale(1.05); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .rolling { animation: diceRoll 0.4s ease-in-out; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
    ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.4); border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

  <!-- TOP HEADER -->
  <header class="px-6 py-3 bg-[#0d0b21]/90 backdrop-blur-xl border-b border-purple-500/20 flex justify-between items-center z-50 shadow-2xl">
    <div class="flex items-center gap-3">
      <div class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-500 flex items-center gap-2 cursor-pointer" onclick="location.reload()">
        👑 LUDO <span class="text-white text-xs px-2.5 py-0.5 bg-purple-600/30 border border-purple-500/40 rounded-full font-bold">PREMIUM</span>
      </div>
    </div>
    
    <div class="hidden md:flex items-center bg-[#070514] p-1.5 rounded-2xl border border-purple-500/20 gap-1 shadow-inner">
      <button id="tab-classic" onclick="switchMode('classic')" class="px-5 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-xs font-extrabold rounded-xl shadow-md cursor-pointer transition">🎲 CLASSIC</button>
      <button id="tab-quick" onclick="switchMode('quick')" class="px-5 py-2 text-slate-400 hover:text-white text-xs font-bold rounded-xl cursor-pointer transition">⚡ QUICK PLAY</button>
      <button id="tab-private" onclick="switchMode('private')" class="px-5 py-2 text-slate-400 hover:text-white text-xs font-bold rounded-xl cursor-pointer transition">🔒 PRIVATE ROOM</button>
    </div>

    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 bg-[#120f2e] border border-yellow-500/30 px-4 py-1.5 rounded-2xl shadow-lg">
        <span class="text-yellow-400 text-sm">🪙</span>
        <span id="coin-balance" class="font-black text-sm text-yellow-300">16,950</span>
        <button onclick="addCoins()" class="w-5 h-5 bg-green-500 hover:bg-green-400 text-slate-950 font-black rounded-full text-xs flex items-center justify-center transition cursor-pointer">+</button>
      </div>
      <button onclick="alert('No new notifications')" class="p-2.5 bg-[#120f2e] border border-purple-500/20 hover:border-purple-500 rounded-2xl text-slate-300 relative transition cursor-pointer">
        🔔 <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-[9px] font-black flex items-center justify-center text-white">3</span>
      </button>
      <button onclick="alert('Settings Panel')" class="p-2.5 bg-[#120f2e] border border-purple-500/20 hover:border-purple-500 rounded-2xl text-slate-300 transition cursor-pointer">⚙️</button>
    </div>
  </header>

  <!-- MAIN GAME SCREEN -->
  <main class="max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-4 gap-6 my-auto">
    
    <!-- LEFT SIDEBAR -->
    <div class="space-y-4 flex flex-col">
      <div class="bg-[#0d0b21]/80 border border-purple-500/20 backdrop-blur-2xl rounded-3xl p-5 space-y-3 shadow-xl">
        <div class="flex items-center gap-2 text-xs font-bold text-purple-400 border-b border-purple-500/20 pb-2">
          ℹ️ GAME INFO
        </div>
        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-400">ROOM CODE</span>
          <span class="font-mono text-purple-300 font-extrabold tracking-wider bg-purple-500/10 px-2.5 py-1 rounded-xl border border-purple-500/20 flex items-center gap-2">
            ABCD1234 📋
          </span>
        </div>
        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-400">GAME MODE</span>
          <span id="display-game-mode" class="text-slate-200 font-bold">Classic</span>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <div class="bg-[#070514] p-2.5 rounded-2xl border border-purple-500/10 text-center">
            <div class="text-[10px] text-slate-500 font-bold">TIME</div>
            <div id="timer-display" class="text-xs font-extrabold text-slate-200">⏱️ 10:00</div>
          </div>
          <div class="bg-[#070514] p-2.5 rounded-2xl border border-purple-500/10 text-center">
            <div class="text-[10px] text-slate-500 font-bold">TURN</div>
            <div id="turn-indicator-text" class="text-xs font-extrabold text-blue-400">🔵 Blue</div>
          </div>
        </div>
      </div>

      <!-- CHAT BOX -->
      <div class="bg-[#0d0b21]/80 border border-purple-500/20 backdrop-blur-2xl rounded-3xl p-4 flex-1 flex flex-col justify-between h-[280px] shadow-xl">
        <div class="flex justify-between items-center border-b border-purple-500/20 pb-2">
          <span class="text-xs font-black text-purple-300 flex items-center gap-2">💬 CHAT</span>
          <span class="text-[10px] text-slate-400 cursor-pointer hover:text-white" onclick="toggleChatBox()">Hide</span>
        </div>
        <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2.5 py-2 text-xs pr-1">
          <div class="p-2.5 bg-[#070514] rounded-xl border border-purple-500/10"><strong class="text-red-400">Ali:</strong> Good luck! <span class="text-[9px] text-slate-500 float-right">10:30 PM</span></div>
          <div class="p-2.5 bg-[#070514] rounded-xl border border-purple-500/10"><strong class="text-green-400">Sara:</strong> Thanks! You too <span class="text-[9px] text-slate-500 float-right">10:31 PM</span></div>
        </div>
        <div class="flex gap-2 pt-2 border-t border-purple-500/20">
          <input id="msg-input" type="text" placeholder="Type a message..." class="flex-1 bg-[#070514] border border-purple-500/20 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500 shadow-inner" onkeypress="if(event.key==='Enter') sendChatMessage()">
          <button onclick="sendChatMessage()" class="px-3.5 py-2 bg-purple-600 hover:bg-purple-500 text-xs font-black rounded-xl shadow-md transition cursor-pointer">🚀</button>
        </div>
      </div>
    </div>

    <!-- CENTER LUDO BOARD & CONTROLS -->
    <div class="lg:col-span-2 bg-[#0d0b21]/50 border border-purple-500/20 backdrop-blur-2xl rounded-[2.5rem] p-5 flex flex-col items-center justify-between shadow-2xl space-y-4">
      
      <!-- LUDO BOARD CONTAINER WITH ABSOLUTE PAWNS OVERLAY -->
      <div class="relative w-full max-w-[430px] aspect-square bg-[#0b091a] border-4 border-purple-500/30 rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.9)] overflow-hidden">
        <svg viewBox="0 0 600 600" class="w-full h-full drop-shadow-2xl">
          <!-- Yards Background -->
          <rect x="0" y="0" width="240" height="240" fill="#dc2626" opacity="0.85" />
          <rect x="360" y="0" width="240" height="240" fill="#16a34a" opacity="0.85" />
          <rect x="0" y="360" width="240" height="240" fill="#ca8a04" opacity="0.85" />
          <rect x="360" y="360" width="240" height="240" fill="#2563eb" opacity="0.85" />

          <!-- Inner Yard Bases -->
          <rect x="30" y="30" width="180" height="180" rx="16" fill="#070514" />
          <rect x="390" y="30" width="180" height="180" rx="16" fill="#070514" />
          <rect x="30" y="390" width="180" height="180" rx="16" fill="#070514" />
          <rect x="390" y="390" width="180" height="180" rx="16" fill="#070514" />

          <!-- Home Tracks -->
          <rect x="40" y="270" width="200" height="60" fill="#dc2626" opacity="0.7" />
          <rect x="270" y="40" width="60" height="200" fill="#16a34a" opacity="0.7" />
          <rect x="360" y="270" width="200" height="60" fill="#2563eb" opacity="0.7" />
          <rect x="270" y="360" width="60" height="200" fill="#ca8a04" opacity="0.7" />

          <!-- Center Triangles -->
          <polygon points="300,300 240,240 240,360" fill="#dc2626" />
          <polygon points="300,300 240,240 360,240" fill="#16a34a" />
          <polygon points="300,300 360,240 360,360" fill="#2563eb" />
          <polygon points="300,300 240,360 360,360" fill="#ca8a04" />
        </svg>

        <!-- HTML Pawns Overlay Container -->
        <div id="pawns-container" class="absolute inset-0 pointer-events-none"></div>
      </div>

      <!-- BOTTOM INTERACTION BAR -->
      <div class="w-full flex items-center justify-between bg-[#070514]/90 p-3 rounded-2xl border border-purple-500/20 shadow-lg">
        <div class="flex items-center gap-2">
          <button onclick="sendQuickEmoji('🔥')" class="p-2.5 bg-[#120f2e] hover:bg-purple-900/40 rounded-xl border border-purple-500/20 text-sm transition cursor-pointer shadow-sm">🔥</button>
          <button onclick="alert('Mic Active')" class="p-2.5 bg-[#120f2e] hover:bg-purple-900/40 rounded-xl border border-purple-500/20 text-sm transition cursor-pointer shadow-sm">🎙️</button>
          <button onclick="alert('Sound On')" class="p-2.5 bg-[#120f2e] hover:bg-purple-900/40 rounded-xl border border-purple-500/20 text-sm transition cursor-pointer shadow-sm">🔊</button>
        </div>

        <div class="flex items-center gap-3">
          <button id="roll-btn" onclick="rollDice()" class="flex items-center gap-3 px-6 py-2.5 bg-gradient-to-r from-purple-600 via-fuchsia-600 to-pink-600 hover:opacity-90 rounded-2xl shadow-lg shadow-purple-600/40 transition transform active:scale-95 cursor-pointer">
            <span id="dice-display" class="text-2xl">🎲</span>
            <span class="font-black text-xs uppercase tracking-wider">ROLL DICE</span>
          </button>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="alert('Rules: Any number rolls can open pawn and move forward!')" class="p-2.5 bg-[#120f2e] hover:bg-purple-900/40 rounded-xl border border-purple-500/20 text-sm transition cursor-pointer">🛡️</button>
          <button onclick="if(confirm('Quit game?')) location.reload()" class="p-2.5 bg-red-950/40 hover:bg-red-900/60 rounded-xl border border-red-500/30 text-sm transition cursor-pointer">🚪</button>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDEBAR: PLAYER CARDS -->
    <div class="space-y-3.5 flex flex-col justify-center">
      <div id="card-red" class="bg-[#0d0b21]/90 border border-red-500/40 rounded-3xl p-3.5 flex items-center justify-between shadow-lg transition-all">
        <div class="flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" class="w-12 h-12 rounded-2xl object-cover border-2 border-red-500">
          <div>
            <div class="text-xs font-black text-slate-100">Ali Khan</div>
            <div class="text-[11px] font-bold text-yellow-400">🪙 1,250</div>
          </div>
        </div>
      </div>

      <div id="card-green" class="bg-[#0d0b21]/90 border border-green-500/40 rounded-3xl p-3.5 flex items-center justify-between shadow-lg transition-all">
        <div class="flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&h=100&fit=crop&crop=faces" class="w-12 h-12 rounded-2xl object-cover border-2 border-green-500">
          <div>
            <div class="text-xs font-black text-slate-100">Sara Malik</div>
            <div class="text-[11px] font-bold text-yellow-400">🪙 980</div>
          </div>
        </div>
      </div>

      <div id="card-blue" class="bg-[#0d0b21]/90 border-2 border-blue-500 rounded-3xl p-3.5 flex items-center justify-between shadow-xl transition-all">
        <div class="flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=100&h=100&fit=crop&crop=faces" class="w-12 h-12 rounded-2xl object-cover border-2 border-blue-500">
          <div>
            <div class="text-xs font-black text-blue-300">Usama (You)</div>
            <div class="text-[11px] font-bold text-yellow-400">🪙 2,450</div>
          </div>
        </div>
      </div>

      <div id="card-yellow" class="bg-[#0d0b21]/90 border border-yellow-500/40 rounded-3xl p-3.5 flex items-center justify-between shadow-lg transition-all">
        <div class="flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop&crop=faces" class="w-12 h-12 rounded-2xl object-cover border-2 border-yellow-500">
          <div>
            <div class="text-xs font-black text-slate-100">Hamza Sajid</div>
            <div class="text-[11px] font-bold text-yellow-400">🪙 760</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    let currentDice = 0;
    let turnOrder = ['blue', 'yellow', 'green', 'red'];
    let currentTurnIndex = 0;

    let gameState = {
      red: [-1, -1, -1, -1],
      green: [-1, -1, -1, -1],
      yellow: [-1, -1, -1, -1],
      blue: [-1, -1, -1, -1]
    };

    // Perfect percentage coordinates mapping right inside each inner base box
    const yardCoords = {
      red:    [{x: 12, y: 12}, {x: 23, y: 12}, {x: 12, y: 23}, {x: 23, y: 23}],
      green:  [{x: 77, y: 12}, {x: 88, y: 12}, {x: 77, y: 23}, {x: 88, y: 23}],
      yellow: [{x: 12, y: 77}, {x: 23, y: 77}, {x: 12, y: 88}, {x: 23, y: 88}],
      blue:   [{x: 77, y: 77}, {x: 88, y: 77}, {x: 77, y: 88}, {x: 88, y: 88}]
    };

    const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

    window.onload = () => {
      renderPawns();
      updateTurnUI();
    };

    function switchMode(mode) {
      document.getElementById('display-game-mode').innerText = mode.toUpperCase();
    }

    function renderPawns() {
      const container = document.getElementById('pawns-container');
      if (!container) return;
      container.innerHTML = '';

      ['red', 'green', 'yellow', 'blue'].forEach(color => {
        gameState[color].forEach((pos, idx) => {
          const pawn = document.createElement('div');
          pawn.className = `pawn pawn-${color} pointer-events-auto`;
          
          let activeColor = turnOrder[currentTurnIndex];
          if (activeColor === color && currentDice > 0) {
            pawn.classList.add('highlight');
          }

          pawn.innerText = idx + 1;
          pawn.onclick = () => handlePawnClick(color, idx);

          let coords = pos === -1 ? yardCoords[color][idx] : { x: 50 + (idx * 3), y: 50 + (pos * 0.5) };
          pawn.style.left = `${coords.x}%`;
          pawn.style.top = `${coords.y}%`;
          container.appendChild(pawn);
        });
      });
    }

    function rollDice() {
      if (currentDice > 0) {
        alert("Please move your pawn first!");
        return;
      }

      const diceDisplay = document.getElementById('dice-display');
      diceDisplay.classList.add('rolling');

      setTimeout(() => {
        currentDice = Math.floor(Math.random() * 6) + 1;
        diceDisplay.innerText = diceFaces[currentDice - 1];
        diceDisplay.classList.remove('rolling');
        renderPawns();
      }, 400);
    }

    function handlePawnClick(color, index) {
      let activeColor = turnOrder[currentTurnIndex];
      if (color !== activeColor) {
        alert(`It's ${activeColor.toUpperCase()}'s turn!`);
        return;
      }

      if (currentDice === 0) {
        alert("Roll the dice first!");
        return;
      }

      let pos = gameState[color][index];
      
      if (pos === -1) {
        gameState[color][index] = 0; 
      } else {
        gameState[color][index] = Math.min(50, pos + currentDice);
      }

      currentDice = 0;
      document.getElementById('dice-display').innerText = '🎲';
      currentTurnIndex = (currentTurnIndex + 1) % turnOrder.length;
      updateTurnUI();
      renderPawns();
    }

    function updateTurnUI() {
      let activeColor = turnOrder[currentTurnIndex];
      let names = { blue: 'Blue (You)', yellow: 'Hamza', green: 'Sara', red: 'Ali' };
      document.getElementById('turn-indicator-text').innerText = `🔵 ${names[activeColor]}`;

      ['red', 'green', 'blue', 'yellow'].forEach(c => {
        const card = document.getElementById(`card-${c}`);
        if (c === activeColor) {
          card.style.transform = "scale(1.02)";
          card.style.borderColor = "#a855f7";
          card.style.boxShadow = "0 0 25px rgba(168, 85, 247, 0.4)";
        } else {
          card.style.transform = "scale(1)";
          card.style.borderColor = "";
          card.style.boxShadow = "";
        }
      });
    }

    function sendChatMessage() {
      const input = document.getElementById('msg-input');
      if (input.value.trim() !== "") {
        const box = document.getElementById('chat-messages');
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        box.innerHTML += `<div class="p-2.5 bg-[#070514] rounded-xl border border-purple-500/10"><strong class="text-blue-400">Usama:</strong> ${input.value.trim()} <span class="text-[9px] text-slate-500 float-right">${timeStr}</span></div>`;
        input.value = "";
        box.scrollTop = box.scrollHeight;
      }
    }

    function sendQuickEmoji(emoji) {
      const box = document.getElementById('chat-messages');
      box.innerHTML += `<div class="p-2.5 bg-[#070514] rounded-xl border border-purple-500/10"><strong class="text-blue-400">Usama:</strong> ${emoji}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function addCoins() {
      let bal = parseInt(document.getElementById('coin-balance').innerText.replace(/,/g, '')) + 500;
      document.getElementById('coin-balance').innerText = bal.toLocaleString();
    }
  </script>
</body>
</html>
