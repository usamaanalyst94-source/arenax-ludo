<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArenaX | Online Multiplayer Ludo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col justify-between">

  <!-- TOP BAR -->
  <header class="p-4 border-b border-slate-800 flex justify-between items-center max-w-5xl mx-auto w-full">
    <h1 class="text-xl font-extrabold text-purple-400">ARENAX <span class="text-white">LUDO ONLINE</span></h1>
    <div id="room-info" class="hidden text-xs bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center gap-2">
      <span>Room Code: <strong id="display-room-code" class="text-purple-400 font-mono">---</strong></span>
      <button onclick="copyInviteLink()" class="bg-purple-600 hover:bg-purple-500 px-2 py-0.5 rounded text-[10px] font-bold">Copy Link 🔗</button>
    </div>
  </header>

  <!-- LOBBY SCREEN -->
  <main id="lobby-screen" class="max-w-md w-full mx-auto p-6 my-auto bg-slate-900 border border-slate-800 rounded-3xl space-y-5">
    <h2 class="text-lg font-bold text-center">Create or Join Private Match</h2>
    <div>
      <label class="text-xs text-slate-400">Your Name</label>
      <input id="username-input" type="text" placeholder="e.g. PlayerOne" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500 mt-1">
    </div>
    <div>
      <label class="text-xs text-slate-400">Room Code (Leave empty to create new)</label>
      <input id="room-input" type="text" placeholder="e.g. LUDO123" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500 mt-1">
    </div>
    <div>
      <label class="text-xs text-slate-400">Select Game Mode</label>
      <select id="mode-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500 mt-1">
        <option value="2">2 Players Match (1v1)</option>
        <option value="4" selected>4 Players Classic Match</option>
      </select>
    </div>
    <button onclick="joinRoom()" class="w-full py-3 bg-purple-600 hover:bg-purple-500 font-bold rounded-xl text-sm">ENTER GAME LOBBY 🎲</button>
  </main>

  <!-- GAMEPLAY & CHAT SCREEN -->
  <main id="game-screen" class="max-w-5xl w-full mx-auto p-4 hidden grid grid-cols-1 md:grid-cols-3 gap-6 my-auto">
    
    <!-- Ludo Board Area -->
    <div class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-3xl p-6 flex flex-col items-center justify-between space-y-4">
      <div class="flex justify-between items-center w-full">
        <span id="turn-banner" class="text-sm font-bold text-purple-400">Waiting for players to join...</span>
        <button id="mic-btn" onclick="toggleVoice()" class="px-3 py-1.5 bg-slate-800 border border-slate-700 text-xs font-bold rounded-xl flex items-center gap-1.5">
          <span id="mic-icon">🎙️</span> <span id="mic-text">Mute Voice</span>
        </button>
      </div>

      <!-- 15x15 GRID BOARD CONTAINER -->
      <div id="board" class="w-full aspect-square bg-slate-950 border-2 border-slate-800 rounded-2xl relative p-1 gap-[1px] overflow-hidden" style="display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); grid-template-rows: repeat(15, minmax(0, 1fr));">
        <!-- Board cells will be populated here -->
      </div>

      <div class="flex items-center gap-4 w-full justify-center">
        <div id="dice-display" class="w-12 h-12 bg-slate-950 border border-purple-500 rounded-xl flex items-center justify-center text-xl font-bold">🎲</div>
        <button id="roll-btn" onclick="triggerDiceRoll()" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 font-bold text-xs rounded-xl">ROLL DICE</button>
      </div>
    </div>

    <!-- Live Chat Sidebar -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4 flex flex-col justify-between h-[450px]">
      <div class="border-b border-slate-800 pb-2 flex justify-between items-center">
        <span class="text-xs font-bold text-slate-300">LIVE CHAT</span>
        <span id="player-count" class="text-[10px] bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded">0 Players</span>
      </div>
      
      <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2 py-3 text-xs"></div>

      <div class="flex gap-2">
        <input id="msg-input" type="text" placeholder="Type a message..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 text-xs text-white focus:outline-none">
        <button onclick="sendChatMessage()" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-xs font-bold rounded-xl">Send</button>
      </div>
    </div>
  </main>

  <footer class="p-4 text-center text-xs text-slate-600">
    ArenaX Realtime Multi-User Architecture &copy; 2026
  </footer>

  <script>
    const socket = io();
    let currentRoom = "", myUsername = "", micEnabled = true;

    window.onload = () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('room')) {
        document.getElementById('room-input').value = params.get('room');
      }
      renderBoard();
    };

    // Render Ludo Board Grid Structure
    function renderBoard() {
      const board = document.getElementById('board');
      if (!board) return;
      board.innerHTML = '';

      for (let row = 0; row < 15; row++) {
        for (let col = 0; col < 15; col++) {
          const cell = document.createElement('div');
          cell.className = "w-full h-full bg-slate-900 border border-slate-950/40 text-[8px] flex items-center justify-center";
          cell.dataset.row = row;
          cell.dataset.col = col;

          // Red Home Base (Top-Left)
          if (row < 6 && col < 6) {
            cell.className = "w-full h-full bg-red-600/30 border border-red-500/40";
          }
          // Green Home Base (Top-Right)
          else if (row < 6 && col > 8) {
            cell.className = "w-full h-full bg-green-600/30 border border-green-500/40";
          }
          // Yellow Home Base (Bottom-Left)
          else if (row > 8 && col < 6) {
            cell.className = "w-full h-full bg-yellow-600/30 border border-yellow-500/40";
          }
          // Blue Home Base (Bottom-Right)
          else if (row > 8 && col > 8) {
            cell.className = "w-full h-full bg-blue-600/30 border border-blue-500/40";
          }
          // Center Home (Winning Area)
          else if (row >= 6 && row <= 8 && col >= 6 && col <= 8) {
            cell.className = "w-full h-full bg-purple-900/40 border border-purple-500/30";
          }

          board.appendChild(cell);
        }
      }
    }

    function joinRoom() {
      myUsername = document.getElementById('username-input').value.trim() || 'Player_' + Math.floor(Math.random()*1000);
      currentRoom = document.getElementById('room-input').value.trim() || 'ROOM_' + Math.floor(Math.random()*9000 + 1000);
      const maxPlayers = document.getElementById('mode-input').value;

      socket.emit('create_or_join_room', { roomId: currentRoom, maxPlayers, username: myUsername });

      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'grid';
      document.getElementById('room-info').classList.remove('hidden');
      document.getElementById('display-room-code').innerText = currentRoom;
    }

    socket.on('room_update', (data) => {
      document.getElementById('player-count').innerText = `${data.players.length} / ${data.maxPlayers} Players`;
      addSystemMessage(`${data.players[data.players.length - 1].username} joined the match!`);
    });

    socket.on('dice_rolled', (data) => {
      document.getElementById('dice-display').innerText = data.diceValue;
      document.getElementById('turn-banner').innerText = `${data.nextTurnPlayer.username}'s Turn (${data.nextTurnPlayer.color})`;
    });

    function triggerDiceRoll() {
      socket.emit('roll_dice');
    }

    function sendChatMessage() {
      const input = document.getElementById('msg-input');
      if (input.value.trim() !== "") {
        socket.emit('send_message', input.value.trim());
        input.value = "";
      }
    }

    socket.on('receive_message', (data) => {
      const box = document.getElementById('chat-messages');
      box.innerHTML += `<div class="p-2 bg-slate-950 rounded-lg border border-slate-800"><strong class="text-purple-400">${data.username}:</strong> ${data.msg}</div>`;
      box.scrollTop = box.scrollHeight;
    });

    function addSystemMessage(msg) {
      const box = document.getElementById('chat-messages');
      box.innerHTML += `<div class="p-1 text-[11px] text-slate-500 text-center font-mono">${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function copyInviteLink() {
      const inviteUrl = `${window.location.origin}?room=${currentRoom}`;
      navigator.clipboard.writeText(inviteUrl);
      alert("Invite Link Copied! Send it to your friends to play together.");
    }

    function toggleVoice() {
      micEnabled = !micEnabled;
      document.getElementById('mic-text').innerText = micEnabled ? "Mute Voice" : "Unmute Voice";
      document.getElementById('mic-icon').innerText = micEnabled ? "🎙️" : "🔇";
    }
  </script>
</body>
</html>
