<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArenaX | Ludo Star Pro Elite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    .ludo-grid {
      display: grid;
      grid-template-columns: repeat(15, minmax(0, 1fr));
      grid-template-rows: repeat(15, minmax(0, 1fr));
    }
    /* Elite Ludo Star 3D Glossy Tokens */
    .pawn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: white;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 6px 15px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.8), inset 0 -2px 4px rgba(0,0,0,0.4);
    }
    .pawn:hover { transform: scale(1.3) translateY(-2px); filter: brightness(1.25); }
    .pawn.highlight { animation: eliteGlow 0.8s infinite alternate; }

    .pawn-red { background: radial-gradient(circle at 30% 30%, #f87171, #dc2626 70%, #991b1b); border: 2px solid #fee2e2; }
    .pawn-green { background: radial-gradient(circle at 30% 30%, #4ade80, #16a34a 70%, #166534); border: 2px solid #dcfce7; }
    .pawn-yellow { background: radial-gradient(circle at 30% 30%, #facc15, #ca8a04 70%, #854d0e); border: 2px solid #fef9c3; }
    .pawn-blue { background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb 70%, #1e40af); border: 2px solid #eff6ff; }

    @keyframes eliteGlow {
      0% { transform: scale(1); box-shadow: 0 0 8px #fff, 0 0 20px currentColor; }
      100% { transform: scale(1.2); box-shadow: 0 0 16px #fff, 0 0 30px currentColor; }
    }

    /* Custom Scrollbar for Pro Chat */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.4); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.8); }
  </style>
</head>
<body class="bg-[#050814] text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

  <header class="px-6 py-3.5 border-b border-slate-800/80 bg-slate-900/40 backdrop-blur-2xl flex justify-between items-center max-w-7xl mx-auto w-full shadow-2xl z-50">
    <div class="flex items-center gap-3">
      <div class="w-3.5 h-3.5 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full shadow-[0_0_12px_#ec4899] animate-pulse"></div>
      <h1 class="text-lg font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-fuchsia-400 to-pink-500">ARENAX <span class="text-white font-light text-xs tracking-normal px-2.5 py-1 bg-purple-500/10 border border-purple-500/20 rounded-xl">ELITE LUDO PRO</span></h1>
    </div>
    <div id="room-info" class="hidden text-xs bg-slate-950/90 border border-slate-800/80 px-4 py-2 rounded-2xl flex items-center gap-4 shadow-inner">
      <span class="text-slate-400">Room: <strong id="display-room-code" class="text-purple-400 font-mono tracking-wider text-sm">---</strong></span>
      <button onclick="copyInviteLink()" class="bg-purple-600 hover:bg-purple-500 transition px-3 py-1.5 rounded-xl text-[11px] font-extrabold shadow-lg shadow-purple-600/30 cursor-pointer">Copy Link 🔗</button>
    </div>
  </header>

  <main id="lobby-screen" class="max-w-md w-full mx-auto p-8 my-auto bg-slate-900/60 border border-slate-800/80 backdrop-blur-3xl rounded-[2.55rem] shadow-[0_0_50px_rgba(0,0,0,0.8)] space-y-6">
    <div class="text-center space-y-2">
      <h2 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-slate-400">Private Battle Arena</h2>
      <p class="text-xs text-slate-400 font-medium">Enter your battle tag to launch the elite match</p>
    </div>
    <div class="space-y-4">
      <div>
        <label class="text-xs font-bold text-slate-300 tracking-wide">Player Battle Name</label>
        <input id="username-input" type="text" placeholder="e.g. CyberKing" class="w-full bg-slate-950/80 border border-slate-800/90 rounded-2xl p-4 text-sm text-slate-200 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 transition mt-1.5 shadow-inner">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-300 tracking-wide">Room Code <span class="text-slate-500 font-normal">(Leave empty to create)</span></label>
        <input id="room-input" type="text" placeholder="e.g. ARENA99" class="w-full bg-slate-950/80 border border-slate-800/90 rounded-2xl p-4 text-sm text-slate-200 font-mono uppercase focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 transition mt-1.5 shadow-inner">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-300 tracking-wide">Match Mode</label>
        <select id="mode-input" class="w-full bg-slate-950/80 border border-slate-800/90 rounded-2xl p-4 text-sm text-slate-200 focus:outline-none focus:border-purple-500 transition mt-1.5">
          <option value="2">1v1 Duel (2 Players)</option>
          <option value="4" selected>Classic 4-Player War</option>
        </select>
      </div>
    </div>
    <button onclick="joinRoom()" class="w-full py-4 bg-gradient-to-r from-purple-600 via-fuchsia-600 to-pink-600 hover:opacity-95 font-black uppercase tracking-widest rounded-2xl text-xs shadow-xl shadow-purple-600/40 transition transform active:scale-95 cursor-pointer">LAUNCH ARENA 🎲</button>
  </main>

  <main id="game-screen" class="max-w-7xl w-full mx-auto p-4 hidden grid grid-cols-1 lg:grid-cols-3 gap-6 my-auto">
    
    <div class="lg:col-span-2 bg-slate-900/30 border border-slate-800/60 backdrop-blur-2xl rounded-[2.5rem] p-6 flex flex-col items-center justify-between space-y-4 shadow-2xl">
      <div class="flex justify-between items-center w-full bg-slate-950/70 px-5 py-3 rounded-2xl border border-slate-800/60 shadow-inner">
        <span id="turn-banner" class="text-xs md:text-sm font-extrabold text-purple-400 flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-purple-500 animate-ping"></span> Match Active. Roll Dice!
        </span>
        <div class="flex items-center gap-3">
          <span id="my-color-badge" class="text-[11px] px-3 py-1 bg-purple-500/20 text-purple-300 border border-purple-500/30 rounded-xl font-bold">Color: Red</span>
          <button onclick="toggleVoice()" class="px-3 py-1.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-xs font-bold rounded-xl transition cursor-pointer">🎙️ Voice</button>
        </div>
      </div>

      <div id="board" class="w-full max-w-[480px] aspect-square bg-[#0a0f1d] border-4 border-slate-800/80 rounded-3xl ludo-grid relative shadow-[0_0_40px_rgba(0,0,0,0.8)] overflow-hidden p-1.5 gap-[1.5px]"></div>

      <div class="flex items-center justify-between w-full max-w-[480px] bg-slate-950/70 px-6 py-4 rounded-2xl border border-slate-800/60 shadow-lg">
        <div class="flex items-center gap-4">
          <div id="dice-display" class="w-16 h-16 bg-slate-900/90 border-2 border-purple-500/80 rounded-2xl flex items-center justify-center text-3xl font-black shadow-lg shadow-purple-500/20 text-purple-300 transform transition hover:scale-105">🎲</div>
          <div>
            <div class="text-[10px] text-slate-400 uppercase tracking-widest font-extrabold">Dice Roller</div>
            <div id="dice-status" class="text-xs font-bold text-slate-200">Ready to roll</div>
          </div>
        </div>
        <button id="roll-btn" onclick="rollDice()" class="px-8 py-4 bg-gradient-to-r from-purple-600 via-fuchsia-600 to-pink-600 hover:opacity-90 font-black text-xs uppercase tracking-widest rounded-2xl shadow-xl shadow-purple-600/40 transition transform active:scale-95 cursor-pointer">ROLL DICE</button>
      </div>
    </div>

    <div class="bg-slate-900/30 border border-slate-800/60 backdrop-blur-2xl rounded-[2.5rem] p-5 flex flex-col justify-between h-[580px] shadow-2xl">
      <div class="border-b border-slate-800/80 pb-3 flex justify-between items-center">
        <span class="text-xs font-black tracking-wider text-slate-300 flex items-center gap-2">💬 TACTICAL CHAT</span>
        <span id="player-count" class="text-[10px] bg-purple-500/20 text-purple-300 border border-purple-500/30 px-3 py-1 rounded-full font-bold">1 / 4 Players</span>
      </div>

      <div class="grid grid-cols-5 gap-2 py-3 border-b border-slate-800/60">
        <button onclick="sendQuickEmoji('🔥')" class="p-2.5 bg-slate-950/80 hover:bg-slate-800 border border-slate-800/80 rounded-2xl text-sm transition cursor-pointer shadow-sm">🔥</button>
        <button onclick="sendQuickEmoji('😎')" class="p-2.5 bg-slate-950/80 hover:bg-slate-800 border border-slate-800/80 rounded-2xl text-sm transition cursor-pointer shadow-sm">😎</button>
        <button onclick="sendQuickEmoji('👏')" class="p-2.5 bg-slate-950/80 hover:bg-slate-800 border border-slate-800/80 rounded-2xl text-sm transition cursor-pointer shadow-sm">👏</button>
        <button onclick="sendQuickEmoji('😂')" class="p-2.5 bg-slate-950/80 hover:bg-slate-800 border border-slate-800/80 rounded-2xl text-sm transition cursor-pointer shadow-sm">😂</button>
        <button onclick="sendQuickEmoji('🎯')" class="p-2.5 bg-slate-950/80 hover:bg-slate-800 border border-slate-800/80 rounded-2xl text-sm transition cursor-pointer shadow-sm">🎯</button>
      </div>
      
      <div id="chat-messages" class="flex-1 overflow-y-auto space-y-3 py-3 text-xs pr-1"></div>

      <div class="flex gap-2 pt-3 border-t border-slate-800/80">
        <input id="msg-input" type="text" placeholder="Type message..." class="flex-1 bg-slate-950/90 border border-slate-800/90 rounded-2xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-purple-500 transition shadow-inner">
        <button onclick="sendChatMessage()" class="px-5 py-3 bg-purple-600 hover:bg-purple-500 text-xs font-black rounded-2xl shadow-md transition cursor-pointer">Send</button>
      </div>
    </div>
  </main>

  <footer class="p-4 text-center text-xs text-slate-600 font-medium">
    ArenaX Elite Multiplayer Engine &copy; 2026
  </footer>

  <script>
    const socket = io();
    let currentRoom = "", myUsername = "", currentDice = 0, currentTurnColor = "red";

    let gameState = {
      red: [-1, -1, -1, -1],
      green: [-1, -1, -1, -1],
      yellow: [-1, -1, -1, -1],
      blue: [-1, -1, -1, -1]
    };

    window.onload = () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('room')) {
        document.getElementById('room-input').value = params.get('room');
      }
      renderBoard();
    };

    function renderBoard() {
      const board = document.getElementById('board');
      if (!board) return;
      board.innerHTML = '';

      for (let row = 0; row < 15; row++) {
        for (let col = 0; col < 15; col++) {
          const cell = document.createElement('div');
          cell.className = "w-full h-full relative flex items-center justify-center";
          cell.dataset.row = row;
          cell.dataset.col = col;

          // Red Yard (Top-Left 6x6)
          if (row < 6 && col < 6) {
            cell.className += " bg-red-950/50";
            if (row >= 1 && row <= 4 && col >= 1 && col <= 4) {
              cell.className = "w-full h-full bg-red-600/90 rounded-2xl m-1 flex items-center justify-center shadow-inner border border-red-500/60";
              let pawnIdx = getRedYardPawnIndex(row, col);
              if (pawnIdx !== -1 && gameState.red[pawnIdx] === -1) {
                cell.appendChild(createPawnElement('red', pawnIdx));
              }
            }
          }
          // Green Yard (Top-Right 6x6)
          else if (row < 6 && col > 8) {
            cell.className += " bg-green-950/50";
            if (row >= 1 && row <= 4 && col >= 10 && col <= 13) {
              cell.className = "w-full h-full bg-green-600/90 rounded-2xl m-1 flex items-center justify-center shadow-inner border border-green-500/60";
              let pawnIdx = getGreenYardPawnIndex(row, col);
              if (pawnIdx !== -1 && gameState.green[pawnIdx] === -1) {
                cell.appendChild(createPawnElement('green', pawnIdx));
              }
            }
          }
          // Yellow Yard (Bottom-Left 6x6)
          else if (row > 8 && col < 6) {
            cell.className += " bg-yellow-950/50";
            if (row >= 10 && row <= 13 && col >= 1 && col <= 4) {
              cell.className = "w-full h-full bg-yellow-600/90 rounded-2xl m-1 flex items-center justify-center shadow-inner border border-yellow-500/60";
              let pawnIdx = getYellowYardPawnIndex(row, col);
              if (pawnIdx !== -1 && gameState.yellow[pawnIdx] === -1) {
                cell.appendChild(createPawnElement('yellow', pawnIdx));
              }
            }
          }
          // Blue Yard (Bottom-Right 6x6)
          else if (row > 8 && col > 8) {
            cell.className += " bg-blue-950/50";
            if (row >= 10 && row <= 13 && col >= 10 && col <= 13) {
              cell.className = "w-full h-full bg-blue-600/90 rounded-2xl m-1 flex items-center justify-center shadow-inner border border-blue-500/60";
              let pawnIdx = getBlueYardPawnIndex(row, col);
              if (pawnIdx !== -1 && gameState.blue[pawnIdx] === -1) {
                cell.appendChild(createPawnElement('blue', pawnIdx));
              }
            }
          }
          // Center Home Winning Zone
          else if (row >= 6 && row <= 8 && col >= 6 && col <= 8) {
            cell.className += " bg-slate-950 border border-slate-800/80";
            if (row === 7 && col === 7) {
              cell.innerHTML = "👑";
              cell.className += " text-base animate-bounce";
            }
          }
          // Tracks & Home Stretches
          else {
            cell.className += " bg-slate-900/90 border border-slate-800/40";
            
            if (row === 7 && col >= 1 && col <= 5) cell.className = "w-full h-full bg-red-600/70 border border-red-500/50 flex items-center justify-center";
            else if (col === 7 && row >= 1 && row <= 5) cell.className = "w-full h-full bg-green-600/70 border border-green-500/50 flex items-center justify-center";
            else if (row === 7 && col >= 9 && col <= 13) cell.className = "w-full h-full bg-blue-600/70 border border-blue-500/50 flex items-center justify-center";
            else if (col === 7 && row >= 9 && row <= 13) cell.className = "w-full h-full bg-yellow-600/70 border border-yellow-500/50 flex items-center justify-center";
            
            // Safe Stars
            if ((row === 6 && col === 1) || (row === 2 && col === 8) || (row === 8 && col === 13) || (col === 6 && row === 12)) {
              cell.innerHTML = "⭐";
              cell.className += " text-[11px]";
            }
          }

          board.appendChild(cell);
        }
      }
    }

    function createPawnElement(color, index) {
      const div = document.createElement('div');
      div.className = `pawn pawn-${color}`;
      div.innerText = index + 1;
      div.onclick = () => handlePawnClick(color, index);
      if (currentTurnColor === color && currentDice > 0) {
        div.classList.add('highlight');
      }
      return div;
    }

    function getRedYardPawnIndex(r, c) {
      if (r === 1 && c === 1) return 0;
      if (r === 1 && c === 4) return 1;
      if (r === 4 && c === 1) return 2;
      if (r === 4 && c === 4) return 3;
      return -1;
    }
    function getGreenYardPawnIndex(r, c) {
      if (r === 1 && c === 10) return 0;
      if (r === 1 && c === 13) return 1;
      if (r === 4 && c === 10) return 2;
      if (r === 4 && c === 13) return 3;
      return -1;
    }
    function getYellowYardPawnIndex(r, c) {
      if (r === 10 && c === 1) return 0;
      if (r === 10 && c === 4) return 1;
      if (r === 13 && c === 1) return 2;
      if (r === 13 && c === 4) return 3;
      return -1;
    }
    function getBlueYardPawnIndex(r, c) {
      if (r === 10 && c === 10) return 0;
      if (r === 10 && c === 13) return 1;
      if (r === 13 && c === 10) return 2;
      if (r === 13 && c === 13) return 3;
      return -1;
    }

    function joinRoom() {
      myUsername = document.getElementById('username-input').value.trim() || 'Player_' + Math.floor(Math.random()*1000);
      currentRoom = document.getElementById('room-input').value.trim().toUpperCase() || 'ELITE_' + Math.floor(Math.random()*9000 + 1000);
      const maxPlayers = document.getElementById('mode-input').value;

      socket.emit('create_or_join_room', { roomId: currentRoom, maxPlayers, username: myUsername });

      document.getElementById('lobby-screen').style.display = 'none';
      const gameScreen = document.getElementById('game-screen');
      gameScreen.classList.remove('hidden');
      gameScreen.style.display = 'grid';

      document.getElementById('room-info').classList.remove('hidden');
      document.getElementById('display-room-code').innerText = currentRoom;
      addSystemMessage(`Connected to Room ${currentRoom} as ${myUsername}`);
    }

    function rollDice() {
      currentDice = Math.floor(Math.random() * 6) + 1;
      document.getElementById('dice-display').innerText = currentDice;
      document.getElementById('dice-status').innerText = `Rolled ${currentDice}. Pick pawn!`;
      renderBoard();
    }

    function handlePawnClick(color, index) {
      if (color !== currentTurnColor) {
        alert("Not your turn!");
        return;
      }
      if (currentDice === 0) {
        alert("Roll the dice first!");
        return;
      }

      let pos = gameState[color][index];
      if (pos === -1) {
        if (currentDice === 6) {
          gameState[color][index] = 0;
          addSystemMessage(`${color.toUpperCase()} pawn ${index+1} entered board!`);
        } else {
          alert("Need a 6 to open pawn!");
          return;
        }
      } else {
        gameState[color][index] = Math.min(58, pos + currentDice);
        addSystemMessage(`${color.toUpperCase()} pawn ${index+1} moved ${currentDice} steps.`);
      }

      currentDice = 0;
      document.getElementById('dice-display').innerText = '🎲';
      document.getElementById('dice-status').innerText = 'Move done. Next turn!';
      
      const colors = ['red', 'green', 'yellow', 'blue'];
      let nextIdx = (colors.indexOf(currentTurnColor) + 1) % colors.length;
      currentTurnColor = colors[nextIdx];
      document.getElementById('turn-banner').innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-ping"></span> ${currentTurnColor.toUpperCase()}'s Turn`;

      renderBoard();
    }

    function sendChatMessage() {
      const input = document.getElementById('msg-input');
      if (input.value.trim() !== "") {
        socket.emit('send_message', { room: currentRoom, username: myUsername, msg: input.value.trim() });
        appendChat(myUsername, input.value.trim());
        input.value = "";
      }
    }

    function sendQuickEmoji(emoji) {
      socket.emit('send_message', { room: currentRoom, username: myUsername, msg: emoji });
      appendChat(myUsername, emoji);
    }

    socket.on('receive_message', (data) => {
      appendChat(data.username, data.msg);
    });

    function appendChat(user, text) {
      const box = document.getElementById('chat-messages');
      box.innerHTML += `<div class="p-3 bg-slate-950/80 rounded-2xl border border-slate-800/80 shadow-sm"><strong class="text-purple-400">${user}:</strong> ${text}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function addSystemMessage(msg) {
      const box = document.getElementById('chat-messages');
      box.innerHTML += `<div class="p-1 text-[11px] text-slate-500 text-center font-mono tracking-tight">${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function copyInviteLink() {
      const inviteUrl = `${window.location.origin}?room=${currentRoom}`;
      navigator.clipboard.writeText(inviteUrl);
      alert("Invite Link Copied!");
    }

    function toggleVoice() {
      alert("Voice Channel Active!");
    }
  </script>
</body>
</html>
