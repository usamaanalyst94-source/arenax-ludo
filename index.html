<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArenaX | Pro Online Multiplayer Ludo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    .ludo-grid {
      display: grid;
      grid-template-columns: repeat(15, minmax(0, 1fr));
      grid-template-rows: repeat(15, minmax(0, 1fr));
    }
    /* Custom Pawn Glow */
    .pawn-red { background: radial-gradient(circle, #f87171 0%, #dc2626 100%); box-shadow: 0 0 10px #ef4444; }
    .pawn-green { background: radial-gradient(circle, #4ade80 0%, #16a34a 100%); box-shadow: 0 0 10px #22c55e; }
    .pawn-yellow { background: radial-gradient(circle, #facc15 0%, #ca8a04 100%); box-shadow: 0 0 10px #eab308; }
    .pawn-blue { background: radial-gradient(circle, #60a5fa 0%, #2563eb 100%); box-shadow: 0 0 10px #3b82f6; }
  </style>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">

  <!-- TOP BAR -->
  <header class="p-4 border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md flex justify-between items-center max-w-6xl mx-auto w-full">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 bg-purple-500 rounded-full animate-ping"></div>
      <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">ARENAX <span class="text-white font-light">LUDO PRO</span></h1>
    </div>
    <div id="room-info" class="hidden text-xs bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl flex items-center gap-3 shadow-inner">
      <span>Room: <strong id="display-room-code" class="text-purple-400 font-mono tracking-wide">---</strong></span>
      <button onclick="copyInviteLink()" class="bg-purple-600 hover:bg-purple-500 transition px-2.5 py-1 rounded-lg text-[10px] font-bold shadow-md">Copy Link 🔗</button>
    </div>
  </header>

  <!-- LOBBY SCREEN -->
  <main id="lobby-screen" class="max-w-md w-full mx-auto p-8 my-auto bg-slate-900/80 border border-slate-800/80 backdrop-blur-xl rounded-3xl shadow-2xl space-y-6">
    <div class="text-center space-y-1">
      <h2 class="text-xl font-extrabold tracking-wide">Private Arena</h2>
      <p class="text-xs text-slate-400">Enter your details to launch the battleground</p>
    </div>
    <div class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-300">Your Battle Name</label>
        <input id="username-input" type="text" placeholder="e.g. ApexPredator" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-purple-500 transition mt-1 shadow-inner">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300">Room Code <span class="text-slate-500 font-normal">(Leave empty to create)</span></label>
        <input id="room-input" type="text" placeholder="e.g. ARENA777" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-sm font-mono uppercase focus:outline-none focus:border-purple-500 transition mt-1 shadow-inner">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300">Match Mode</label>
        <select id="mode-input" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-purple-500 transition mt-1">
          <option value="2">1v1 Duel (2 Players)</option>
          <option value="4" selected>Classic Warfare (4 Players)</option>
        </select>
      </div>
    </div>
    <button onclick="joinRoom()" class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 font-extrabold rounded-2xl text-sm shadow-lg shadow-purple-600/30 transition transform active:scale-95">LAUNCH ARENA 🎲</button>
  </main>

  <!-- GAMEPLAY & CHAT SCREEN -->
  <main id="game-screen" class="max-w-6xl w-full mx-auto p-4 hidden grid grid-cols-1 lg:grid-cols-3 gap-6 my-auto">
    
    <!-- Ludo Board Area -->
    <div class="lg:col-span-2 bg-slate-900/60 border border-slate-800/80 backdrop-blur-md rounded-3xl p-6 flex flex-col items-center justify-between space-y-4 shadow-2xl">
      <div class="flex justify-between items-center w-full bg-slate-950/60 px-4 py-2.5 rounded-2xl border border-slate-800/50">
        <span id="turn-banner" class="text-xs md:text-sm font-bold text-purple-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-purple-500 animate-pulse"></span> Waiting for players...
        </span>
        <button id="mic-btn" onclick="toggleVoice()" class="px-3 py-1.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-xs font-bold rounded-xl flex items-center gap-1.5 transition">
          <span id="mic-icon">🎙️</span> <span id="mic-text">Voice On</span>
        </button>
      </div>

      <!-- PRO 15x15 LUDO BOARD CONTAINER -->
      <div id="board" class="w-full max-w-[460px] aspect-square bg-slate-950 border-4 border-slate-800 rounded-2xl ludo-grid relative shadow-inner overflow-hidden p-1">
        <!-- Dynamically rendered professional board cells and tokens -->
      </div>

      <!-- DICE & CONTROLS -->
      <div class="flex items-center gap-6 w-full justify-center bg-slate-950/40 p-3 rounded-2xl border border-slate-800/50">
        <div class="flex items-center gap-3">
          <div id="dice-display" class="w-14 h-14 bg-slate-900 border-2 border-purple-500/80 rounded-2xl flex items-center justify-center text-2xl font-black shadow-lg shadow-purple-500/20 text-purple-300">🎲</div>
          <div class="text-left">
            <div class="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Dice Roll</div>
            <div id="dice-status" class="text-xs font-semibold text-slate-300">Ready</div>
          </div>
        </div>
        <button id="roll-btn" onclick="triggerDiceRoll()" class="px-8 py-4 bg-gradient-to-r from-purple-600 via-fuchsia-600 to-pink-600 hover:opacity-90 font-black text-xs uppercase tracking-widest rounded-2xl shadow-xl shadow-purple-600/30 transition transform active:scale-95">ROLL DICE</button>
      </div>
    </div>

    <!-- Live Chat Sidebar -->
    <div class="bg-slate-900/60 border border-slate-800/80 backdrop-blur-md rounded-3xl p-5 flex flex-col justify-between h-[520px] shadow-2xl">
      <div class="border-b border-slate-800/80 pb-3 flex justify-between items-center">
        <span class="text-xs font-black tracking-wider text-slate-300 flex items-center gap-2">💬 ARENA CHAT</span>
        <span id="player-count" class="text-[10px] bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2.5 py-1 rounded-full font-bold">0 / 4 Players</span>
      </div>
      
      <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2.5 py-3 text-xs pr-1"></div>

      <div class="flex gap-2 pt-2 border-t border-slate-800/80">
        <input id="msg-input" type="text" placeholder="Type tactical message..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500 transition">
        <button onclick="sendChatMessage()" class="px-4 py-2.5 bg-purple-600 hover:bg-purple-500 text-xs font-extrabold rounded-xl shadow-md transition">Send</button>
      </div>
    </div>
  </main>

  <footer class="p-4 text-center text-xs text-slate-600 font-medium">
    ArenaX Pro Multiplayer Engine &copy; 2026
  </footer>

  <script>
    const socket = io();
    let currentRoom = "", myUsername = "", micEnabled = true;

    window.onload = () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('room')) {
        document.getElementById('room-input').value = params.get('room');
      }
      renderProfessionalBoard();
    };

    // Render Professional Ludo Board with Yards, Safe Spots & Tokens
    function renderProfessionalBoard() {
      const board = document.getElementById('board');
      if (!board) return;
      board.innerHTML = '';

      for (let row = 0; row < 15; row++) {
        for (let col = 0; col < 15; col++) {
          const cell = document.createElement('div');
          cell.className = "w-full h-full relative flex items-center justify-center text-[7px]";
          cell.dataset.row = row;
          cell.dataset.col = col;

          // 1. Red Base (Top-Left 6x6)
          if (row < 6 && col < 6) {
            cell.className += " bg-red-950/40 border-[0.5px] border-red-500/30";
            // Add Red Yard Inner Box & Pawns
            if ((row === 1 || row === 4) && (col === 1 || col === 4)) {
              const pawn = document.createElement('div');
              pawn.className = "w-3/4 h-3/4 rounded-full pawn-red flex items-center justify-center text-[8px] font-bold text-white shadow-md animate-pulse";
              cell.appendChild(pawn);
            }
          }
          // 2. Green Base (Top-Right 6x6)
          else if (row < 6 && col > 8) {
            cell.className += " bg-green-950/40 border-[0.5px] border-green-500/30";
            if ((row === 1 || row === 4) && (col === 10 || col === 13)) {
              const pawn = document.createElement('div');
              pawn.className = "w-3/4 h-3/4 rounded-full pawn-green flex items-center justify-center text-[8px] font-bold text-white shadow-md animate-pulse";
              cell.appendChild(pawn);
            }
          }
          // 3. Yellow Base (Bottom-Left 6x6)
          else if (row > 8 && col < 6) {
            cell.className += " bg-yellow-950/40 border-[0.5px] border-yellow-500/30";
            if ((row === 10 || row === 13) && (col === 1 || col === 4)) {
              const pawn = document.createElement('div');
              pawn.className = "w-3/4 h-3/4 rounded-full pawn-yellow flex items-center justify-center text-[8px] font-bold text-white shadow-md animate-pulse";
              cell.appendChild(pawn);
            }
          }
          // 4. Blue Base (Bottom-Right 6x6)
          else if (row > 8 && col > 8) {
            cell.className += " bg-blue-950/40 border-[0.5px] border-blue-500/30";
            if ((row === 10 || row === 13) && (col === 10 || col === 13)) {
              const pawn = document.createElement('div');
              pawn.className = "w-3/4 h-3/4 rounded-full pawn-blue flex items-center justify-center text-[8px] font-bold text-white shadow-md animate-pulse";
              cell.appendChild(pawn);
            }
          }
          // 5. Center Home Winning Area
          else if (row >= 6 && row <= 8 && col >= 6 && col <= 8) {
            cell.className += " bg-gradient-to-br from-purple-900/80 to-slate-900 border border-purple-500/40";
            if(row === 7 && col === 7) {
              cell.innerHTML = "🏆";
            }
          }
          // 6. Main Paths & Home Columns
          else {
            cell.className += " bg-slate-900/90 border-[0.5px] border-slate-800";
            // Highlight specific tracks / safe spots
            if ((row === 6 && col === 1) || (row === 8 && col === 13) || (col === 6 && row === 13) || (col === 8 && row === 1)) {
              cell.style.backgroundColor = "rgba(168, 85, 247, 0.15)";
              cell.innerHTML = "⭐";
            }
            // Colored home paths
            if (row === 7 && col > 0 && col < 6) cell.className += " bg-red-600/30";
            if (col === 7 && row > 0 && row < 6) cell.className += " bg-green-600/30";
            if (row === 7 && col > 8 && col < 14) cell.className += " bg-blue-600/30";
            if (col === 7 && row > 8 && row < 14) cell.className += " bg-yellow-600/30";
          }

          board.appendChild(cell);
        }
      }
    }

    function joinRoom() {
      myUsername = document.getElementById('username-input').value.trim() || 'Player_' + Math.floor(Math.random()*1000);
      currentRoom = document.getElementById('room-input').value.trim().toUpperCase() || 'ROOM_' + Math.floor(Math.random()*9000 + 1000);
      const maxPlayers = document.getElementById('mode-input').value;

      socket.emit('create_or_join_room', { roomId: currentRoom, maxPlayers, username: myUsername });

      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'grid';
      document.getElementById('room-info').classList.remove('hidden');
      document.getElementById('display-room-code').innerText = currentRoom;
    }

    socket.on('room_update', (data) => {
      document.getElementById('player-count').innerText = `${data.players.length} / ${data.maxPlayers} Players`;
      addSystemMessage(`${data.players[data.players.length - 1].username} joined the match!`);
    });

    socket.on('dice_rolled', (data) => {
      document.getElementById('dice-display').innerText = data.diceValue;
      document.getElementById('turn-banner').innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 animate-ping"></span> ${data.nextTurnPlayer.username}'s Turn (${data.nextTurnPlayer.color})`;
    });

    function triggerDiceRoll() {
      socket.emit('roll_dice');
    }

    function sendChatMessage() {
      const input = document.getElementById('msg-input');
      if (input.value.trim() !== "") {
        socket.emit('send_message', input.value.trim());
        input.value = "";
      }
    }

    socket.on('receive_message', (data) => {
      const box = document.getElementById('chat-messages');
      box.innerHTML += `<div class="p-2.5 bg-slate-950/80 rounded-xl border border-slate-800/80 shadow-sm"><strong class="text-purple-400">${data.username}:</strong> ${data.msg}</div>`;
      box.scrollTop = box.scrollHeight;
    });

    function addSystemMessage(msg) {
      const box = document.getElementById('chat-messages');
      box.innerHTML += `<div class="p-1 text-[11px] text-slate-500 text-center font-mono tracking-tight">${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function copyInviteLink() {
      const inviteUrl = `${window.location.origin}?room=${currentRoom}`;
      navigator.clipboard.writeText(inviteUrl);
      alert("Invite Link Copied! Send it to your friends to play together.");
    }

    function toggleVoice() {
      micEnabled = !micEnabled;
      document.getElementById('mic-text').innerText = micEnabled ? "Voice On" : "Muted";
      document.getElementById('mic-icon').innerText = micEnabled ? "🎙️" : "🔇";
    }
  </script>
</body>
</html>
