<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArenaX | Ludo Star Pro Ultimate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    .ludo-grid {
      display: grid;
      grid-template-columns: repeat(15, minmax(0, 1fr));
      grid-template-rows: repeat(15, minmax(0, 1fr));
    }
    /* High-end Ludo Star Gem Tokens */
    .pawn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: white;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.6);
    }
    .pawn:hover { transform: scale(1.25); filter: brightness(1.2); }
    .pawn.highlight { animation: bounceGlow 0.8s infinite alternate; }

    .pawn-red { background: linear-gradient(135deg, #f87171, #dc2626); border: 2px solid #fee2e2; }
    .pawn-green { background: linear-gradient(135deg, #4ade80, #16a34a); border: 2px solid #dcfce7; }
    .pawn-yellow { background: linear-gradient(135deg, #facc15, #ca8a04); border: 2px solid #fef9c3; }
    .pawn-blue { background: linear-gradient(135deg, #60a5fa, #2563eb); border: 2px solid #eff6ff; }

    @keyframes bounceGlow {
      0% { transform: scale(1); box-shadow: 0 0 5px #fff, 0 0 10px currentColor; }
      100% { transform: scale(1.15); box-shadow: 0 0 15px #fff, 0 0 25px currentColor; }
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-white font-sans min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">

  <!-- TOP HEADER -->
  <header class="px-6 py-4 border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-xl flex justify-between items-center max-w-7xl mx-auto w-full shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-3.5 h-3.5 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full animate-ping"></div>
      <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-fuchsia-400 to-pink-500">ARENAX <span class="text-white font-light text-sm tracking-normal px-2 py-0.5 bg-purple-500/20 border border-purple-500/30 rounded-lg">LUDO STAR PRO</span></h1>
    </div>
    <div id="room-info" class="hidden text-xs bg-slate-950/80 border border-slate-800 px-4 py-2 rounded-2xl flex items-center gap-4 shadow-inner">
      <span>Room Code: <strong id="display-room-code" class="text-purple-400 font-mono tracking-wider">---</strong></span>
      <button onclick="copyInviteLink()" class="bg-purple-600 hover:bg-purple-500 transition px-3 py-1 rounded-xl text-[11px] font-bold shadow-md cursor-pointer">Copy Invite 🔗</button>
    </div>
  </header>

  <!-- LOBBY SCREEN -->
  <main id="lobby-screen" class="max-w-md w-full mx-auto p-8 my-auto bg-slate-900/90 border border-slate-800/90 backdrop-blur-2xl rounded-3xl shadow-2xl space-y-6">
    <div class="text-center space-y-1.5">
      <h2 class="text-2xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">Private Ludo Match</h2>
      <p class="text-xs text-slate-400">Configure your profile & enter the battle arena</p>
    </div>
    <div class="space-y-4">
      <div>
        <label class="text-xs font-bold text-slate-300">Your Player Name</label>
        <input id="username-input" type="text" placeholder="e.g. MasterKing" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm focus:outline-none focus:border-purple-500 transition mt-1.5 shadow-inner">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-300">Room Code <span class="text-slate-500 font-normal">(Leave empty to create new)</span></label>
        <input id="room-input" type="text" placeholder="e.g. STAR99" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm font-mono uppercase focus:outline-none focus:border-purple-500 transition mt-1.5 shadow-inner">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-300">Match Mode</label>
        <select id="mode-input" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm focus:outline-none focus:border-purple-500 transition mt-1.5">
          <option value="2">1v1 Duel (2 Players)</option>
          <option value="4" selected>Classic 4-Player Battle</option>
        </select>
      </div>
    </div>
    <button onclick="joinRoom()" class="w-full py-4 bg-gradient-to-r from-purple-600 via-fuchsia-600 to-pink-600 hover:opacity-95 font-black uppercase tracking-wider rounded-2xl text-xs shadow-xl shadow-purple-600/30 transition transform active:scale-95 cursor-pointer">START GAME 🎲</button>
  </main>

  <!-- GAMEPLAY & CHAT SCREEN -->
  <main id="game-screen" class="max-w-7xl w-full mx-auto p-4 hidden grid grid-cols-1 lg:grid-cols-3 gap-6 my-auto">
    
    <!-- Ludo Board Area -->
    <div class="lg:col-span-2 bg-slate-900/50 border border-slate-800/70 backdrop-blur-xl rounded-3xl p-6 flex flex-col items-center justify-between space-y-4 shadow-2xl">
      <div class="flex justify-between items-center w-full bg-slate-950/70 px-5 py-3 rounded-2xl border border-slate-800/60 shadow-inner">
        <span id="turn-banner" class="text-xs md:text-sm font-black text-purple-400 flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-purple-500 animate-ping"></span> Game Ready. Roll Dice!
        </span>
        <div class="flex items-center gap-3">
          <span id="my-color-badge" class="text-[11px] px-3 py-1 bg-purple-500/20 text-purple-300 border border-purple-500/30 rounded-xl font-bold">Color: Red</span>
          <button onclick="toggleVoice()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold rounded-xl transition cursor-pointer">🎙️ Voice</button>
        </div>
      </div>

      <!-- PROFESSIONAL 15x15 LUDO STAR BOARD -->
      <div id="board" class="w-full max-w-[480px] aspect-square bg-[#0f172a] border-4 border-slate-800 rounded-3xl ludo-grid relative shadow-2xl overflow-hidden p-1 gap-[1px]"></div>

      <!-- DICE & CONTROLS BAR -->
      <div class="flex items-center justify-between w-full max-w-[480px] bg-slate-950/60 px-6 py-4 rounded-2xl border border-slate-800/70 shadow-lg">
        <div class="flex items-center gap-4">
          <div id="dice-display" class="w-16 h-16 bg-slate-900 border-2 border-purple-500/80 rounded-2xl flex items-center justify-center text-3xl font-black shadow-lg shadow-purple-500/20 text-purple-300 transform transition hover:scale-105">🎲</div>
          <div>
            <div class="text-[10px] text-slate-400 uppercase tracking-widest font-extrabold">Current Roll</div>
            <div id="dice-status" class="text-xs font-bold text-slate-200">Waiting for roll</div>
          </div>
        </div>
        <button id="roll-btn" onclick="rollDice()" class="px-8 py-4 bg-gradient-to-r from-purple-600 via-fuchsia-600 to-pink-600 hover:opacity-90 font-black text-xs uppercase tracking-widest rounded-2xl shadow-xl shadow-purple-600/30 transition transform active:scale-95 cursor-pointer">ROLL DICE</button>
      </div>
    </div>

    <!-- Live Chat & Quick Emojis Sidebar -->
    <div class="bg-slate-900/50 border border-slate-800/70 backdrop-blur-xl rounded-3xl p-5 flex flex-col justify-between h-[560px] shadow-2xl">
      <div class="border-b border-slate-800/80 pb-3 flex justify-between items-center">
        <span class="text-xs font-black tracking-wider text-slate-300 flex items-center gap-2">💬 ARENA CHAT & REACTIONS</span>
        <span id="player-count" class="text-[10px] bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2.5 py-1 rounded-full font-bold">1 / 4 Players</span>
      </div>

      <!-- Quick Emoji Bar -->
      <div class="grid grid-cols-5 gap-1.5 py-2 border-b border-slate-800/60">
        <button onclick="sendQuickEmoji('🔥')" class="p-2 bg-slate-950 hover:bg-slate-800 rounded-xl text-sm transition cursor-pointer">🔥</button>
        <button onclick="sendQuickEmoji('😎')" class="p-2 bg-slate-950 hover:bg-slate-800 rounded-xl text-sm transition cursor-pointer">😎</button>
        <button onclick="sendQuickEmoji('👏')" class="p-2 bg-slate-950 hover:bg-slate-800 rounded-xl text-sm transition cursor-pointer">👏</button>
        <button onclick="sendQuickEmoji('😂')" class="p-2 bg-slate-950 hover:bg-slate-800 rounded-xl text-sm transition cursor-pointer">😂</button>
        <button onclick="sendQuickEmoji('🎯')" class="p-2 bg-slate-950 hover:bg-slate-800 rounded-xl text-sm transition cursor-pointer">🎯</button>
      </div>
      
      <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2.5 py-3 text-xs pr-1"></div>

      <div class="flex gap-2 pt-2 border-t border-slate-800/80">
        <input id="msg-input" type="text" placeholder="Type tactical message..." class="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-purple-500 transition shadow-inner">
        <button onclick="sendChatMessage()" class="px-5 py-3 bg-purple-600 hover:bg-purple-500 text-xs font-black rounded-2xl shadow-md transition cursor-pointer">Send</button>
      </div>
    </div>
  </main>

  <footer class="p-4 text-center text-xs text-slate-600 font-medium">
    ArenaX Pro Multiplayer Engine &copy; 2026
  </footer>

  <script>
    const socket = io();
    let currentRoom = "", myUsername = "", myColor = "red", currentDice = 0, currentTurnColor = "red";

    // 4 Pawns state for each color: position (-1 = yard, 0-51 = track, 52-57 = home stretch, 58 = won)
    let gameState = {
      red: [-1, -1, -1, -1],
      green: [-1, -1, -1, -1],
      yellow: [-1, -1, -1, -1],
      blue: [-1, -1, -1, -1]
    };

    window.onload = () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('room')) {
        document.getElementById('room-input').value = params.get('room');
      }
      renderBoard();
    };

    function renderBoard() {
      const board = document.getElementById('board');
      if (!board) return;
      board.innerHTML = '';

      for (let row = 0; row < 15; row++) {
        for (let col = 0; col < 15; col++) {
          const cell = document.createElement('div');
          cell.className = "w-full h-full relative flex items-center justify-center";
          cell.dataset.row = row;
          cell.dataset.col = col;

          // Red Home Yard (Top-Left 6x6)
          if (row < 6 && col < 6) {
            cell.className += " bg-red-600/90";
            if (row >= 1 && row <= 4 && col >= 1 && col <= 4) {
              cell.className = "w-full h-full bg-red-500/90 rounded-2xl m-1 flex items-center justify-center shadow-inner border border-red-400/50";
              // Check if red pawn is here
              let pawnIdx = getRedYardPawnIndex(row, col);
              if (pawnIdx !== -1 && gameState.red[pawnIdx] === -1) {
                const pawn = createPawnElement('red', pawnIdx);
                cell.appendChild(pawn);
              }
            }
          }
          // Green Home Yard (Top-Right 6x6)
          else if (row < 6 && col > 8) {
            cell.className += " bg-green-600/90";
            if (row >= 1 && row <= 4 && col >= 10 && col <= 13) {
              cell.className = "w-full h-full bg-green-500/90 rounded-2xl m-1 flex items-center justify-center shadow-inner border border-green-400/50";
              let pawnIdx = getGreenYardPawnIndex(row, col);
              if (pawnIdx !== -1 && gameState.green[pawnIdx] === -1) {
                const pawn = createPawnElement('green', pawnIdx);
                cell.appendChild(pawn);
              }
            }
          }
          // Yellow Home Yard (Bottom-Left 6x6)
          else if (row > 8 && col < 6) {
            cell.className += " bg-yellow-600/90";
            if (row >= 10 && row <= 13 && col >= 1 && col <= 4) {
              cell.className = "w-full h-full bg-yellow-500/90 rounded-2xl m-1 flex items-center justify-center shadow-inner border border-yellow-400/50";
              let pawnIdx = getYellowYardPawnIndex(row, col);
              if (pawnIdx !== -1 && gameState.yellow[pawnIdx] === -1) {
                const pawn = createPawnElement('yellow', pawnIdx);
                cell.appendChild(pawn);
              }
            }
          }
          // Blue Home Yard (Bottom-Right 6x6)
          else if (row > 8 && col > 8) {
            cell.className += " bg-blue-600/90";
            if (row >= 10 && row <= 13 && col >= 10 && col <= 13) {
              cell.className = "w-full h-full bg-blue-500/90 rounded-2xl m-1 flex items-center justify-center shadow-inner border border-blue-400/50";
              let pawnIdx = getBlueYardPawnIndex(row, col);
              if (pawnIdx !== -1 && gameState.blue[pawnIdx] === -1) {
                const pawn = createPawnElement('yellow', pawnIdx); // Wait, blue pawn
                cell.appendChild(createPawnElement('blue', pawnIdx));
              }
            }
          }
          // Center Home Winning Area
          else if (row >= 6 && row <= 8 && col >= 6 && col <= 8) {
            cell.className += " bg-slate-950 border border-slate-800";
            if (row === 7 && col === 7) {
              cell.innerHTML = "👑";
              cell.className += " text-sm animate-bounce";
            }
          }
          // Tracks & Home Paths
          else {
            cell.className += " bg-slate-900 border border-slate-800/80";
            
            // Colored Home Stretch Paths
            if (row === 7 && col >= 1 && col <= 5) cell.className = "w-full h-full bg-red-600/80 border border-red-700 flex items-center justify-center";
            else if (col === 7 && row >= 1 && row <= 5) cell.className = "w-full h-full bg-green-600/80 border border-green-700 flex items-center justify-center";
            else if (row === 7 && col >= 9 && col <= 13) cell.className = "w-full h-full bg-blue-600/80 border border-blue-700 flex items-center justify-center";
            else if (col === 7 && row >= 9 && row <= 13) cell.className = "w-full h-full bg-yellow-500/80 border border-yellow-600 flex items-center justify-center";
            
            // Safe Stars
            if ((row === 6 && col === 1) || (row === 2 && col === 8) || (row === 8 && col === 13) || (col === 6 && row === 12)) {
              cell.innerHTML = "⭐";
              cell.className += " text-[10px]";
            }
          }

          board.appendChild(cell);
        }
      }
    }

    function createPawnElement(color, index) {
      const div = document.createElement('div');
      div.className = `pawn pawn-${color}`;
      div.innerText = index + 1;
      div.onclick = () => handlePawnClick(color, index);
      if (currentTurnColor === color && currentDice > 0) {
        div.classList.add('highlight');
      }
      return div;
    }

    // Yard coordinate helpers
    function getRedYardPawnIndex(r, c) {
      if (r === 1 && c === 1) return 0;
      if (r === 1 && c === 4) return 1;
      if (r === 4 && c === 1) return 2;
      if (r === 4 && c === 4) return 3;
      return -1;
    }
    function getGreenYardPawnIndex(r, c) {
      if (r === 1 && c === 10) return 0;
      if (r === 1 && c === 13) return 1;
      if (r === 4 && c === 10) return 2;
      if (r === 4 && c === 13) return 3;
      return -1;
    }
    function getYellowYardPawnIndex(r, c) {
      if (r === 10 && c === 1) return 0;
      if (r === 10 && c === 4) return 1;
      if (r === 13 && c === 1) return 2;
      if (r === 13 && c === 4) return 3;
      return -1;
    }
    function getBlueYardPawnIndex(r, c) {
      if (r === 10 && c === 10) return 0;
      if (r === 10 && c === 13) return 1;
      if (r === 13 && c === 10) return 2;
      if (r === 13 && c === 13) return 3;
      return -1;
    }

    function joinRoom() {
      myUsername = document.getElementById('username-input').value.trim() || 'Player_' + Math.floor(Math.random()*1000);
      currentRoom = document.getElementById('room-input').value.trim().toUpperCase() || 'STAR_' + Math.floor(Math.random()*9000 + 1000);
      const maxPlayers = document.getElementById('mode-input').value;

      socket.emit('create_or_join_room', { roomId: currentRoom, maxPlayers, username: myUsername });

      document.getElementById('lobby-screen').style.display = 'none';
      const gameScreen = document.getElementById('game-screen');
      gameScreen.classList.remove('hidden');
      gameScreen.style.display = 'grid';

      document.getElementById('room-info').classList.remove('hidden');
      document.getElementById('display-room-code').innerText = currentRoom;
      addSystemMessage(`Welcome ${myUsername}! Room ${currentRoom} connected.`);
    }

    function rollDice() {
      currentDice = Math.floor(Math.random() * 6) + 1;
      document.getElementById('dice-display').innerText = currentDice;
      document.getElementById('dice-status').innerText = `Rolled a ${currentDice}! Select a pawn to move.`;
      
      // Notify server & update UI highlight
      socket.emit('roll_dice_action', { roomId: currentRoom, dice: currentDice });
      renderBoard();
    }

    function handlePawnClick(color, index) {
      if (color !== currentTurnColor) {
        alert("Not your turn or color!");
        return;
      }
      if (currentDice === 0) {
        alert("Roll the dice first!");
        return;
      }

      let pos = gameState[color][index];
      if (pos === -1) {
        if (currentDice === 6) {
          gameState[color][index] = 0; // Exit yard
          addSystemMessage(`${color.toUpperCase()} pawn ${index+1} entered the board!`);
        } else {
          alert("You need a 6 to open/exit your pawn!");
          return;
        }
      } else {
        gameState[color][index] = Math.min(58, pos + currentDice);
        addSystemMessage(`${color.toUpperCase()} pawn ${index+1} moved forward by ${currentDice}.`);
      }

      currentDice = 0;
      document.getElementById('dice-display').innerText = '🎲';
      document.getElementById('dice-status').innerText = 'Move completed. Next turn!';
      
      // Switch turn rotation
      const colors = ['red', 'green', 'yellow', 'blue'];
      let nextIdx = (colors.indexOf(currentTurnColor) + 1) % colors.length;
      currentTurnColor = colors[nextIdx];
      document.getElementById('turn-banner').innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-ping"></span> ${currentTurnColor.toUpperCase()}'s Turn`;

      renderBoard();
    }

    function sendChatMessage() {
      const input = document.getElementById('msg-input');
      if (input.value.trim() !== "") {
        socket.emit('send_message', { room: currentRoom, username: myUsername, msg: input.value.trim() });
        appendChat(myUsername, input.value.trim());
        input.value = "";
      }
    }

    function sendQuickEmoji(emoji) {
      socket.emit('send_message', { room: currentRoom, username: myUsername, msg: emoji });
      appendChat(myUsername, emoji);
    }

    socket.on('receive_message', (data) => {
      appendChat(data.username, data.msg);
    });

    function appendChat(user, text) {
      const box = document.getElementById('chat-messages');
      box.innerHTML += `<div class="p-2.5 bg-slate-950/80 rounded-2xl border border-slate-800/80 shadow-sm"><strong class="text-purple-400">${user}:</strong> ${text}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function addSystemMessage(msg) {
      const box = document.getElementById('chat-messages');
      box.innerHTML += `<div class="p-1 text-[11px] text-slate-500 text-center font-mono tracking-tight">${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function copyInviteLink() {
      const inviteUrl = `${window.location.origin}?room=${currentRoom}`;
      navigator.clipboard.writeText(inviteUrl);
      alert("Invite Link Copied! Send it to your friends to play together.");
    }

    function toggleVoice() {
      alert("Voice chat stream active. Microphone connected!");
    }
  </script>
</body>
</html>
